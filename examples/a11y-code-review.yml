name: Accessibility Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  a11y-review:
    runs-on: [self-hosted]
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Accessibility Review
        uses: rtCamp/ax-review@v1.2.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-provider: openrouter
          model: google/gemini-3.7-flash
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          output-mode: comments
          fail-on-issues: true
          max-files: 50
          batch-size: 10
