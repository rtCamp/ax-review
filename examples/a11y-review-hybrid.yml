name: Accessibility Review Hybrid

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      input-type:
        description: "Input type: urls | csv | sitemap"
        required: true
        default: "urls"
        type: choice
        options:
          - urls
          - csv
          - sitemap
      urls:
        description: "URLs, local CSV path, or sitemap URL(s) (based on input-type)"
        required: true
        default: "https://example.com"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Job 1: AI Code review (Runs on PRs)
  code-review:
    name: AI Accessibility Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Fetch base branch for diff
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Install & run Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
          gitleaks detect --source . --redact --no-banner

      - name: Collect changed files
        id: changed-files
        run: |
          set -euo pipefail

          BASE_REF="origin/${{ github.base_ref }}"

          git diff --name-only --diff-filter=ACMR "$BASE_REF" HEAD > changed-files.txt || true

          grep -E '\.(jsx?|tsx?)$' changed-files.txt > changed-jsx.txt  || true
          grep -E '\.php$'         changed-files.txt > changed-php.txt  || true
          grep -E '\.html$'        changed-files.txt > changed-html.txt || true

          jsx_count=$(wc  -l < changed-jsx.txt  | tr -d ' ')
          php_count=$(wc  -l < changed-php.txt  | tr -d ' ')
          html_count=$(wc -l < changed-html.txt | tr -d ' ')

          echo "jsx_count=$jsx_count"   >> "$GITHUB_OUTPUT"
          echo "php_count=$php_count"   >> "$GITHUB_OUTPUT"
          echo "html_count=$html_count" >> "$GITHUB_OUTPUT"

      - name: Prepare a11y findings directory
        run: mkdir -p .a11y-results

      - name: Setup Node
        if: steps.changed-files.outputs.jsx_count != '0' || steps.changed-files.outputs.php_count != '0' || steps.changed-files.outputs.html_count != '0'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install npm dependencies
        if: steps.changed-files.outputs.jsx_count != '0' || steps.changed-files.outputs.php_count != '0' || steps.changed-files.outputs.html_count != '0'
        run: |
          npm install --prefix .a11y-tools \
            eslint \
            eslint-plugin-jsx-a11y \
            @typescript-eslint/parser \
            pa11y

      - name: Write Pa11y config
        if: steps.changed-files.outputs.php_count != '0' || steps.changed-files.outputs.html_count != '0'
        run: |
          cat > pa11y.json << 'EOF'
          {
            "chromeLaunchConfig": {
              "args": ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
            }
          }
          EOF

      - name: Write ESLint a11y config
        if: steps.changed-files.outputs.jsx_count != '0'
        run: |
          # Written into .a11y-tools/ so ESM imports resolve from .a11y-tools/node_modules/
          cat > .a11y-tools/eslint.config.a11y.mjs << 'EOF'
          import jsxA11y from 'eslint-plugin-jsx-a11y';
          import tsParser from '@typescript-eslint/parser';

          export default [
            {
              files: ['**/*.{js,jsx,ts,tsx}'],
              plugins: { 'jsx-a11y': jsxA11y },
              languageOptions: {
                parser: tsParser,
                parserOptions: {
                  ecmaVersion: 2021,
                  sourceType: 'module',
                  ecmaFeatures: { jsx: true },
                },
              },
              rules: jsxA11y.configs.recommended.rules,
            },
          ];
          EOF

      - name: Run ESLint on JSX/TSX files
        if: steps.changed-files.outputs.jsx_count != '0'
        run: |
          cat << 'SCRIPT' > eslint-to-findings.js
          const fs              = require('fs');
          const path            = require('path');
          const { spawnSync }   = require('child_process');

          const CHANGED_FILES_PATH = 'changed-jsx.txt';
          const OUT_DIR            = '.a11y-results';
          const REPO_ROOT          = process.env.GITHUB_WORKSPACE || process.cwd();
          const CONFIG_PATH        = path.resolve('.a11y-tools/eslint.config.a11y.mjs');
          const ESLINT_BIN         = path.resolve('.a11y-tools/node_modules/.bin/eslint');

          const raw      = fs.readFileSync(CHANGED_FILES_PATH, 'utf8').trim();
          const jsxFiles = raw.split('\n').map(f => f.trim()).filter(Boolean);

          if (jsxFiles.length === 0) {
            console.log('No JSX/TSX files to lint.');
            process.exit(0);
          }

          console.log(`Linting ${jsxFiles.length} JSX/TSX file(s)`);

          const eslintRun = spawnSync(
            ESLINT_BIN,
            [
              '--flag', 'unstable_config_lookup_from_file',
              '--config', CONFIG_PATH,
              '--format', 'json',
              ...jsxFiles,
            ],
            { encoding: 'utf8', cwd: REPO_ROOT }
          );

          if (eslintRun.error) throw eslintRun.error;
          if ((eslintRun.status || 0) >= 2) {
            throw new Error(`ESLint exited with code ${eslintRun.status}:\n${eslintRun.stderr || ''}`);
          }

          const eslintOut = (eslintRun.stdout || '').trim();
          if (!eslintOut) {
            console.log('ESLint produced no output. Treating as no findings.');
            process.exit(0);
          }

          const fileResults = JSON.parse(eslintOut);
          fs.mkdirSync(OUT_DIR, { recursive: true });

          let totalIssues     = 0;
          let filesWithIssues = 0;

          for (const fileResult of fileResults) {
            const a11yMessages = fileResult.messages.filter(
              m => m.ruleId != null && m.ruleId.startsWith('jsx-a11y/')
            );
            if (a11yMessages.length === 0) continue;

            const relSource   = path.relative(REPO_ROOT, fileResult.filePath);
            const sourceLines = (fileResult.source || '').split('\n');

            const findings = a11yMessages.map(m => ({
              code:       m.ruleId,
              type:       m.severity === 2 ? 'error' : 'warning',
              message:    m.message,
              context:    (sourceLines[m.line - 1] || '').trim(),
              selector:   `line:${m.line}:${m.column}`,
              sourceFile: relSource,
            }));

            totalIssues     += findings.length;
            filesWithIssues += 1;

            const safeName = relSource.replace(/[/\\]/g, '_').replace(/\.[jt]sx?$/, '');
            const outFile  = path.join(OUT_DIR, `jsx-a11y__${safeName}.json`);
            fs.writeFileSync(outFile, JSON.stringify(findings, null, 2));
            console.log(`${relSource}: ${findings.length} issue(s) -> ${outFile}`);
          }

          console.log(`\nDone. ${totalIssues} jsx-a11y issue(s) across ${filesWithIssues} file(s).`);
          SCRIPT
          node eslint-to-findings.js

      - name: Setup PHP
        if: steps.changed-files.outputs.php_count != '0'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'

      - name: Write Pa11y manifest runner
        if: steps.changed-files.outputs.php_count != '0' || steps.changed-files.outputs.html_count != '0'
        run: |
          cat << 'SCRIPT' > run-pa11y-on-manifest.js
          const fs            = require('fs');
          const path          = require('path');
          const { spawnSync } = require('child_process');

          const [,, manifestPath, outDir, prefix = 'pa11y'] = process.argv;

          if (!manifestPath || !outDir) {
            console.error('Usage: node run-pa11y-on-manifest.js <manifest.json> <output-dir> <prefix>');
            process.exit(3);
          }

          const PA11Y_BIN = path.resolve('.a11y-tools/node_modules/.bin/pa11y');
          const manifest  = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          fs.mkdirSync(outDir, { recursive: true });

          let totalIssues = 0;

          for (const { source, extracted } of manifest) {
            const absExtracted = path.resolve(extracted);

            if (!fs.existsSync(absExtracted)) {
              console.warn(`Skipping ${source}: extracted file not found (${extracted})`);
              continue;
            }

            console.log(`Pa11y (${prefix}): ${source}`);

            const run = spawnSync(
              PA11Y_BIN,
              [
                `file://${absExtracted}`,
                '--standard', 'WCAG2AA',
                '--reporter',  'json',
                '--config',    './pa11y.json',
              ],
              { encoding: 'utf8' }
            );

            if (run.error) throw run.error;

            if (run.status === 1) {
              const errOut = (run.stderr || '').trim();
              console.warn(`  ::warning::pa11y failed for ${source} (exit ${run.status})${errOut ? ': ' + errOut : ''}. Skipping.`);
              continue;
            }

            const out    = (run.stdout || '').trim();
            let   issues = [];

            if (out) {
              try {
                const parsed = JSON.parse(out);
                issues = Array.isArray(parsed) ? parsed : [];
              } catch (e) {
                console.warn(`  Could not parse pa11y output for ${source}: ${e.message}`);
              }
            }

            for (const issue of issues) {
              issue.sourceFile    = source;
              issue.extractedFrom = extracted;
            }

            totalIssues += issues.length;

            const safeName = source.replace(/[/\\]/g, '_').replace(/\.(php|html?)$/, '');
            const outFile  = path.join(outDir, `${prefix}__${safeName}.json`);
            fs.writeFileSync(outFile, JSON.stringify(issues, null, 2));
            console.log(`  ${issues.length} issue(s) -> ${outFile}`);
          }

          console.log(`\nDone. ${totalIssues} total issue(s) across ${manifest.length} file(s).`);
          SCRIPT

      - name: Write PHP inline HTML extractor
        if: steps.changed-files.outputs.php_count != '0'
        run: |
          cat > extract-inline-html.php << 'PHPEOF'
          <?php

          if ($argc < 3) {
              fwrite(STDERR, "Usage: php extract-inline-html.php <input.php> <output.html>\n");
              exit(3);
          }

          $inputFile  = $argv[1];
          $outputFile = $argv[2];

          if (!is_file($inputFile)) {
              fwrite(STDERR, "Input file not found: {$inputFile}\n");
              exit(3);
          }

          $lintOutput = [];
          $lintExit   = 0;
          exec('php -l ' . escapeshellarg($inputFile) . ' 2>&1', $lintOutput, $lintExit);

          if ($lintExit !== 0) {
              fwrite(STDERR, "PHP syntax invalid, skipping: {$inputFile}\n");
              fwrite(STDERR, implode("\n", $lintOutput) . "\n");
              exit(2);
          }

          $source = file_get_contents($inputFile);
          if ($source === false) {
              fwrite(STDERR, "Could not read file: {$inputFile}\n");
              exit(3);
          }

          $tokens     = token_get_all($source);
          $htmlChunks = [];

          foreach ($tokens as $token) {
              if (!is_array($token)) continue;
              [$id, $text] = $token;
              if ($id === T_INLINE_HTML) $htmlChunks[] = $text;
          }

          $markup = trim(implode("\n", $htmlChunks));
          if ($markup === '') exit(1);

          $relPath = basename($inputFile);
          $page    = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Extracted markup: {$relPath}</title>\n</head>\n<body>\n{$markup}\n</body>\n</html>\n";

          $dir = dirname($outputFile);
          if (!is_dir($dir)) mkdir($dir, 0777, true);

          file_put_contents($outputFile, $page);
          fwrite(STDOUT, "Extracted inline HTML from {$inputFile} -> {$outputFile}\n");
          exit(0);
          PHPEOF

      - name: Extract inline HTML from PHP files
        if: steps.changed-files.outputs.php_count != '0'
        run: |
          cat << 'SCRIPT' > extract-php-html.js
          const fs            = require('fs');
          const path          = require('path');
          const { spawnSync } = require('child_process');

          const CHANGED_FILES_PATH = 'changed-php.txt';
          const TMP_DIR            = 'php-html-tmp';
          const MANIFEST_PATH      = 'php-html-manifest.json';
          const EXTRACTOR_SCRIPT   = path.resolve('extract-inline-html.php');
          const REPO_ROOT          = process.env.GITHUB_WORKSPACE || process.cwd();

          if (!fs.existsSync(CHANGED_FILES_PATH)) {
            console.log(`${CHANGED_FILES_PATH} not found. Nothing to process.`);
            fs.writeFileSync(MANIFEST_PATH, '[]');
            process.exit(0);
          }

          const phpFiles = fs.readFileSync(CHANGED_FILES_PATH, 'utf8')
            .split('\n').map(f => f.trim()).filter(Boolean);

          if (phpFiles.length === 0) {
            console.log('No PHP files to process.');
            fs.writeFileSync(MANIFEST_PATH, '[]');
            process.exit(0);
          }

          fs.mkdirSync(TMP_DIR, { recursive: true });
          const manifest = [];

          for (const file of phpFiles) {
            const absFile = path.join(REPO_ROOT, file);

            if (!fs.existsSync(absFile)) {
              console.log(`::warning::Changed PHP file no longer exists, skipping: ${file}`);
              continue;
            }

            const safe = file.replace(/\//g, '_');
            const out  = path.join(TMP_DIR, `${safe}.html`);

            const result = spawnSync('php', [EXTRACTOR_SCRIPT, absFile, out], { encoding: 'utf8' });
            if (result.error) throw result.error;

            switch (result.status) {
              case 0:
                manifest.push({ source: file, extracted: out });
                console.log(`Extracted: ${file} -> ${out}`);
                break;
              case 1:
                console.log(`No inline HTML in ${file}, skipping.`);
                break;
              case 2:
                console.log(`::warning::PHP syntax error in ${file}, skipping.`);
                if (result.stderr) process.stderr.write(result.stderr);
                break;
              default:
                console.log(`::warning::Unexpected exit ${result.status} for ${file}, skipping.`);
                break;
            }
          }

          fs.writeFileSync(MANIFEST_PATH, JSON.stringify(manifest, null, 2));
          console.log(`\n${manifest.length} PHP file(s) with inline HTML -> ${MANIFEST_PATH}`);
          SCRIPT
          node extract-php-html.js

      - name: Run Pa11y against PHP-extracted HTML
        if: steps.changed-files.outputs.php_count != '0'
        run: node run-pa11y-on-manifest.js php-html-manifest.json .a11y-results php-html

      - name: Wrap HTML pattern/template files
        if: steps.changed-files.outputs.html_count != '0'
        run: |
          cat << 'SCRIPT' > wrap-html-patterns.js
          const fs   = require('fs');
          const path = require('path');

          const CHANGED_FILES_PATH = 'changed-html.txt';
          const TMP_DIR            = 'html-pattern-tmp';
          const MANIFEST_PATH      = 'html-pattern-manifest.json';
          const REPO_ROOT          = process.env.GITHUB_WORKSPACE || process.cwd();

          if (!fs.existsSync(CHANGED_FILES_PATH)) {
            console.log(`${CHANGED_FILES_PATH} not found. Nothing to process.`);
            fs.writeFileSync(MANIFEST_PATH, '[]');
            process.exit(0);
          }

          const htmlFiles = fs.readFileSync(CHANGED_FILES_PATH, 'utf8')
            .split('\n').map(f => f.trim()).filter(Boolean);

          if (htmlFiles.length === 0) {
            console.log('No HTML pattern/template files to process.');
            fs.writeFileSync(MANIFEST_PATH, '[]');
            process.exit(0);
          }

          fs.mkdirSync(TMP_DIR, { recursive: true });
          const manifest = [];

          for (const file of htmlFiles) {
            const absFile = path.join(REPO_ROOT, file);

            if (!fs.existsSync(absFile)) {
              console.log(`::warning::Changed HTML file no longer exists, skipping: ${file}`);
              continue;
            }

            const markup = fs.readFileSync(absFile, 'utf8').trim();
            if (markup === '') {
              console.log(`${file} is empty, skipping.`);
              continue;
            }

            const safe    = file.replace(/\//g, '_');
            const outPath = path.join(TMP_DIR, `${safe}.html`);
            const page    = [
              '<!DOCTYPE html>',
              '<html lang="en">',
              '<head>',
              '    <meta charset="UTF-8">',
              `    <title>Pattern preview: ${path.basename(file)}</title>`,
              '</head>',
              '<body>',
              markup,
              '</body>',
              '</html>',
              '',
            ].join('\n');

            fs.writeFileSync(outPath, page, 'utf8');
            manifest.push({ source: file, extracted: outPath });
            console.log(`Wrapped: ${file} -> ${outPath}`);
          }

          fs.writeFileSync(MANIFEST_PATH, JSON.stringify(manifest, null, 2));
          console.log(`\n${manifest.length} HTML pattern/template file(s) wrapped -> ${MANIFEST_PATH}`);
          SCRIPT
          node wrap-html-patterns.js

      - name: Run Pa11y against wrapped HTML files
        if: steps.changed-files.outputs.html_count != '0'
        run: node run-pa11y-on-manifest.js html-pattern-manifest.json .a11y-results html-pattern

      - name: Summarize baseline findings
        run: |
          set -euo pipefail
          count=$(find .a11y-results -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "::notice::Collected baseline a11y findings from $count file(s) across legacy tools."
          ls -la .a11y-results 2>/dev/null || true

      - name: Run Accessibility Review
        uses: rtCamp/ax-review@v1.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-provider: litellm
          model: openrouter/google/gemini-3.7-flash
          api-key: ${{ secrets.LITELLM_API_KEY }}
          output-mode: comments
          fail-on-issues: true
          max-files: 50
          batch-size: 10
          a11y-findings-dir: .a11y-results

  # Job 2: URL audit (Runs manually via workflow_dispatch)
  url-audit:
    name: URL Accessibility Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    permissions:
      issues: write
      contents: read
      actions: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install deps
        run: |
          npm init -y
          npm install playwright @axe-core/playwright lighthouse pa11y

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "::notice::Playwright browsers restored from cache — installing OS deps only"
            npx playwright install-deps chromium
          else
            echo "::notice::Playwright browser cache miss — full install"
            npx playwright install --with-deps chromium
          fi

      - name: Resolve URLs
        run: |
          cat << 'SCRIPT' > resolve-urls.js
          const fs = require('fs');
          const path = require('path');
          const http = require('https');
          const httpPlain = require('http');

          const inputType = process.env.INPUT_TYPE.trim();
          const input     = process.env.INPUT_VALUE.trim();

          function fetch(url) {
            return new Promise((resolve, reject) => {
              const client = url.startsWith('https') ? http : httpPlain;
              client.get(url, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  const redirectUrl = res.headers.location;
                  res.resume();
                  return resolve(fetch(redirectUrl));
                }
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });
          }

          function extractSitemapUrls(xml) {
            const matches = [...xml.matchAll(/<loc>\s*(.*?)\s*<\/loc>/gi)];
            return matches.map(m => m[1].trim()).filter(Boolean);
          }

          async function resolveSitemap(url, visited) {
            if (visited.has(url)) {
              console.warn(`Already visited ${url}, skipping to avoid cycles`);
              return [];
            }
            visited.add(url);
            console.log(`Resolving sitemap: ${url}`);
            const content = await fetch(url);
            const extracted = extractSitemapUrls(content);
            const results = [];
            for (const item of extracted) {
              if (/\.xml(\?|$)/i.test(item)) {
                results.push(...await resolveSitemap(item, visited));
              } else {
                results.push(item);
              }
            }
            return [...new Set(results)];
          }

          function extractCsvUrls(csv) {
            const lines = csv.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            if (lines.length === 0) return [];
            const header = lines[0].toLowerCase().split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const urlColIndex = header.findIndex(h => h === 'url' || h === 'urls');
            const hasHeader = urlColIndex !== -1 || !header[0].startsWith('http');
            const dataLines = hasHeader ? lines.slice(1) : lines;
            const colIndex  = urlColIndex !== -1 ? urlColIndex : 0;
            return dataLines
              .map(line => {
                const cols = line.split(',');
                return (cols[colIndex] || '').trim().replace(/^"|"$/g, '');
              })
              .filter(v => v.startsWith('http'));
          }

          async function main() {
            let urls = [];

            if (inputType === 'sitemap') {
              const sitemapEntries = input.split(',').map(s => s.trim()).filter(Boolean);
              console.log(`Resolving ${sitemapEntries.length} sitemap(s)...`);
              const visited = new Set();
              for (const sitemapUrl of sitemapEntries) {
                const found = await resolveSitemap(sitemapUrl, visited);
                console.log(`  ${sitemapUrl}: ${found.length} URL(s)`);
                urls.push(...found);
              }
              urls = [...new Set(urls)];
              console.log(`Found ${urls.length} unique URL(s) across all sitemaps`);

            } else if (inputType === 'csv') {
              console.log(`Reading local CSV: ${input}`);
              try {
                const csvContent = fs.readFileSync(path.resolve(input), 'utf8');
                urls = extractCsvUrls(csvContent);
              } catch (err) {
                console.error(`Failed to read local CSV file: ${err.message}`);
                process.exit(1);
              }
              console.log(`Found ${urls.length} URL(s) in CSV`);

            } else {
              urls = input.split(',').map(u => u.trim()).filter(Boolean);
              console.log(`Using ${urls.length} URL(s) from direct input`);
            }

            if (urls.length === 0) {
              console.error('No valid URLs found. Aborting.');
              process.exit(1);
            }

            fs.writeFileSync('resolved-urls.txt', urls.join(','), 'utf8');
            console.log(`resolved-urls.txt written with ${urls.length} URL(s)`);
          }

          main().catch(err => { console.error(err); process.exit(1); });
          SCRIPT
          node resolve-urls.js
        env:
          INPUT_TYPE:  ${{ github.event.inputs.input-type }}
          INPUT_VALUE: ${{ github.event.inputs.urls }}

      - name: Write Pa11y config
        run: |
          cat > pa11y.json << 'EOF'
          {
            "chromeLaunchConfig": {
