name: 'ax-review'
description: 'Automated WCAG 2.2 accessibility review of PR diffs using LLMs'
author: ''
branding:
  icon: 'eye'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub API token for PR access'
    required: true
    default: '${{ github.token }}'

  llm-provider:
    description: 'LLM provider to use (gemini, ollama, openrouter, or litellm)'
    required: true
    default: 'gemini'

  api-key:
    description: 'API key for the LLM provider. Required for Gemini (https://aistudio.google.com/apikey), Ollama (https://ollama.com/settings/keys), OpenRouter (https://openrouter.ai/keys), and LiteLLM (master key or virtual key from your proxy).'
    required: false

  model:
    description: 'Model name to use (provider-specific defaults if not specified)'
    required: false

  ollama-url:
    description: 'Ollama Cloud API endpoint (default: https://ollama.com)'
    required: false
    default: 'https://ollama.com'

  output-mode:
    description: 'Output format: "checks" (default, recommended) for Check Run annotations, or "comments" for PR review comments'
    required: false
    default: 'checks'

  fail-on-issues:
    description: 'Fail the action if VIOLATION issues are found'
    required: false
    default: 'true'

  max-files:
    description: 'Maximum number of files to analyze (0 for unlimited)'
    required: false
    default: '100'

  batch-size:
    description: 'Number of files per LLM request'
    required: false
    default: '20'

  skip-drafts:
    description: 'Skip analysis for draft PRs'
    required: false
    default: 'true'

  a11y-findings-dir:
    description: 'Optional path to a directory containing pre-generated a11y reports from earlier workflow steps (used for baseline context).'
    required: false

  exclude-paths:
    description: |
      Newline-separated list of path prefixes to exclude from accessibility scanning.
      Example:
        exclude-paths: |
          vendor/
          wp-content/plugins/third-party/
          public/assets/lib/
    required: false
    default: ''

  wcag-levels:
    description: |
      Comma-separated list of WCAG conformance levels to include in the report.
      Valid values: A, AA, AAA (case-insensitive).
      Use this to restrict reporting to specific levels:
        - 'A'        — Critical blockers only
        - 'A,AA'     — Standard legal baseline (most common)
        - 'A,AA,AAA' — Full audit including enhanced criteria (default)
    required: false
    default: 'A,AA,AAA'

outputs:
  issues-found:
    description: 'Total number of issues found'

  violations:
    description: 'Number of VIOLATION severity issues'

  good-practices:
    description: 'Number of GOOD_PRACTICE severity issues'

runs:
  using: 'node24'
  main: 'dist/index.js'
